<title>채용공고 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style id="css">
/* Layout: one narrow column of posting cards, sorted by deadline; a tab switches to a dated timeline. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #5d6b79;
  --line: #dde3e9;
  --accent: #1f5fae;
  --accent-soft: #e5eefa;
  --urgent: #c2410c;
  --urgent-soft: #fdeee4;
  --ok: #1d7a4f;
  --ok-soft: #e3f4ea;
  --gone: #8a96a3;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #19212a; --ink: #e6ebf0; --muted: #9aa7b4; --line: #2a3541;
    --accent: #7fb0ec; --accent-soft: #1d2d42; --urgent: #f59e6b; --urgent-soft: #3a2418;
    --ok: #6fcf9c; --ok-soft: #173126; --gone: #6b7785; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #19212a; --ink: #e6ebf0; --muted: #9aa7b4; --line: #2a3541;
  --accent: #7fb0ec; --accent-soft: #1d2d42; --urgent: #f59e6b; --urgent-soft: #3a2418;
  --ok: #6fcf9c; --ok-soft: #173126; --gone: #6b7785; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 1.6rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2, h3 { margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 0.92rem; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 6px 8px; }
button.ghost:hover { color: var(--accent); }
button.danger { color: var(--urgent); border-color: var(--urgent); }
button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, textarea, select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 11px; min-width: 0; }
textarea { resize: vertical; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
.hint { font-size: 0.82rem; color: var(--muted); margin: 0; }
.banner { font-size: 0.88rem; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); }
.banner.warn { background: var(--urgent-soft); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--muted); font-weight: 600; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.list { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.past { opacity: .72; }
.card-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.card-head > div { min-width: 0; }
.company { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
.title { font-size: 1.08rem; font-weight: 700; overflow-wrap: anywhere; }
.dday { font-family: var(--font-data); font-weight: 600; font-size: 0.9rem; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; }
.dday.urgent { background: var(--urgent-soft); color: var(--urgent); }
.dday.gone { background: var(--line); color: var(--gone); }
.dday.none { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.88rem; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 500; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.chip { font-size: 0.78rem; padding: 2px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.steps { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 0.82rem; color: var(--muted); }
.steps span + span::before { content: "→"; margin-right: 4px; color: var(--line); }
.sched { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 0.88rem; }
.sched li { display: flex; gap: 10px; }
.sched time { font-family: var(--font-data); font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; }
details { border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; font-size: 0.88rem; font-weight: 600; color: var(--accent); }
.jd { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; font-size: 0.9rem; }
.jd h4 { margin: 0 0 2px; font-size: 0.82rem; color: var(--muted); letter-spacing: 0.02em; }
.jd ul { margin: 0; padding-left: 18px; }
.memos { display: flex; flex-direction: column; gap: 6px; }
.memo { background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 0.9rem; display: flex; gap: 8px; align-items: flex-start; }
.memo p { margin: 0; flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.memo time { font-family: var(--font-data); font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.memo-add { display: flex; gap: 6px; }
.memo-add input { flex: 1; }
.status { width: auto; padding: 5px 8px; font-size: 0.85rem; }
.foot { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
a { color: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 32px 16px; border: 1px dashed var(--line); border-radius: 12px; }
.tl-day { display: flex; flex-direction: column; gap: 6px; }
.tl-date { font-family: var(--font-data); font-weight: 600; font-size: 0.88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.tl-item.deadline { border-left: 3px solid var(--urgent); }
.tl-item .label { font-weight: 600; }
.today-mark { color: var(--accent); }
.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-nav h2 { font-size: 1.05rem; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cal-h { background: var(--surface); text-align: center; font-size: 0.75rem; font-weight: 600; color: var(--muted); padding: 6px 0; }
.cal-h.sun, .cal-d.sun .num { color: var(--urgent); }
.cal-d { background: var(--surface); border: none; border-radius: 0; min-height: 78px; padding: 4px 3px; display: flex; flex-direction: column; gap: 2px; align-items: stretch; text-align: left; min-width: 0; }
.cal-d:hover { border: none; background: var(--accent-soft); }
.cal-d.other { background: var(--bg); }
.cal-d.other .num, .cal-d.other .ev { opacity: .45; }
.cal-d.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.cal-d .num { font-family: var(--font-data); font-size: 0.78rem; font-weight: 600; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.cal-d.today .num { background: var(--accent); color: var(--surface); }
.ev { font-size: 0.68rem; line-height: 1.35; padding: 1px 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--accent-soft); color: var(--accent); }
.ev.deadline { background: var(--urgent-soft); color: var(--urgent); font-weight: 600; }
.ev.start { background: var(--ok-soft); color: var(--ok); }
.ev.more { background: none; color: var(--muted); padding: 0 4px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; background: var(--accent-soft); border: 1px solid var(--accent); }
.legend i.deadline { background: var(--urgent-soft); border-color: var(--urgent); }
.legend i.start { background: var(--ok-soft); border-color: var(--ok); }
.pending { font-size: 0.88rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }
@media (max-width: 420px) { .cal-d { min-height: 64px; } .ev { font-size: 0.62rem; padding: 1px 2px; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 0.9rem; max-width: calc(100% - 32px); z-index: 20; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -1px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
<div id="root" class="wrap"></div>
<script id="jobs-data" type="application/json">[]</script>
<script id="app">
(function () {
  "use strict";
  // Skeleton the published page is wrapped in; used when the page saves itself.
  var HEAD = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>\n';
  var STATUSES = ["관심", "지원예정", "지원완료", "서류합격", "면접", "최종합격", "불합격", "포기"];

  var jobs = [];
  try { jobs = JSON.parse(document.getElementById("jobs-data").textContent) || []; } catch (e) { jobs = []; }

  // Scheduled task that reads pending links (fired through the Claude Code Remote connector). Empty: not set up.
  var TRIGGER_ID = "";
  var now0 = new Date();
  var ui = { tab: "calendar", showPast: false, editing: null, busy: false, readOnly: false, mode: "loading",
    calY: now0.getFullYear(), calM: now0.getMonth(), selDay: null };
  var artifactApi = null, sampleApi = null, mcpApi = null;

  // ---------- helpers ----------
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) for (var k in props) {
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === "text") el.textContent = v;
      else if (k === "on") for (var ev in v) el.addEventListener(ev, v[ev]);
      else if (k === "class") el.className = v;
      else if (k in el && k !== "list" && k !== "form") el[k] = v;
      else el.setAttribute(k, v);
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach(function (x) { add(el, x); });
    else el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
  function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
  function todayStr() {
    var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function validDate(s) { return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function daysUntil(s) {
    if (!validDate(s)) return null;
    var p = s.split("-").map(Number), t = new Date(), a = Date.UTC(p[0], p[1] - 1, p[2]), b = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate());
    return Math.round((a - b) / 86400000);
  }
  var WD = ["일", "월", "화", "수", "목", "금", "토"];
  function fmtDate(s) {
    if (!validDate(s)) return s || "";
    var p = s.split("-").map(Number), d = new Date(p[0], p[1] - 1, p[2]);
    return p[1] + "." + pad(p[2]) + " (" + WD[d.getDay()] + ")";
  }
  function safeUrl(u) { return typeof u === "string" && /^https:\/\//i.test(u.trim()) ? u.trim() : null; }
  function lines(s) { return String(s || "").split("\n").map(function (x) { return x.trim(); }).filter(Boolean); }
  function arr(x) { return Array.isArray(x) ? x.map(String).filter(Boolean) : []; }
  function toast(t) {
    var old = document.querySelector(".toast"); if (old) old.remove();
    var el = h("div", { class: "toast", role: "status", text: t }); document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 3500);
  }

  // ---------- saving: the page republishes itself with the new data ----------
  function buildHtml() {
    var css = document.getElementById("css").textContent;
    var app = document.getElementById("app").textContent;
    var data = JSON.stringify(jobs).replace(/</g, "\\u003c");
    var fonts = document.querySelector('link[rel="stylesheet"]');
    return HEAD +
      "<title>채용공고 보드</title>\n" +
      '<meta name="claude:viewport-fit-sides" content="cover">\n' +
      (fonts ? '<link rel="stylesheet" href="' + fonts.getAttribute("href").replace(/&/g, "&amp;") + '">\n' : "") +
      '<style id="css">' + css + "</style>\n" +
      '<div id="root" class="wrap"></div>\n' +
      '<script id="jobs-data" type="application/json">' + data + "<\/script>\n" +
      '<script id="app">' + app + "<\/script>\n\n</body></html>";
  }
  function save(doneMsg) {
    if (ui.readOnly) { toast("보기 전용이라 저장할 수 없어요."); return Promise.resolve(false); }
    if (!artifactApi) { toast("이 화면에서는 저장되지 않아요. claude.ai에서 열어 주세요."); render(); return Promise.resolve(false); }
    ui.busy = true; render();
    try { sessionStorage.setItem("jb-msg", doneMsg || "저장했어요."); } catch (e) {}
    return artifactApi.publish(buildHtml()).then(function () { return true; }, function (e) {
      ui.busy = false;
      try { sessionStorage.removeItem("jb-msg"); } catch (x) {}
      var c = e && e.code;
      if (c === "conflict") { try { sessionStorage.setItem("jb-msg", "다른 사람이 먼저 저장해서 최신 내용으로 바뀌었어요. 다시 해 주세요."); } catch (x) {} }
      else if (c === "not_writer" || c === "not_granted" || c === "capability_disabled" || c === "consent_required" || c === "capability_removed") {
        ui.readOnly = true; toast("보기 전용 링크예요. 공고를 추가하려면 편집 권한이 필요해요.");
      } else if (c === "rate_limited") toast("저장이 너무 잦아요. 잠시 후 다시 해 주세요.");
      else if (c === "too_large") toast("저장할 내용이 너무 커요. 오래된 공고를 지워 주세요.");
      else toast("저장하지 못했어요. 잠시 후 다시 해 주세요.");
      render(); return false;
    });
  }

  // ---------- AI extraction ----------
  function buildPrompt(url, text) {
    return "너는 채용공고 정리 도우미야. 아래 채용공고 본문을 읽고 정보를 추출해서 JSON 객체 하나만 답해. 설명이나 코드블록 없이 JSON만.\n" +
      "오늘 날짜: " + todayStr() + " (연도가 생략된 날짜는 오늘 이후 가장 가까운 날짜로 해석)\n" +
      "형식:\n" +
      '{"company": "회사명", "title": "공고/직무명", "employment": "정규직/인턴/계약직 등, 모르면 빈 문자열", "location": "근무지, 모르면 빈 문자열",' +
      ' "applyStart": "YYYY-MM-DD 또는 null", "applyEnd": "YYYY-MM-DD 또는 null (상시채용/채용시마감이면 null)", "applyEndTime": "HH:MM 또는 빈 문자열",' +
      ' "applyNote": "상시채용, 채용시 마감 같은 마감 관련 메모, 없으면 빈 문자열",' +
      ' "process": ["전형 단계를 순서대로, 예: 서류전형, 코딩테스트, 1차면접"],' +
      ' "schedule": [{"date": "YYYY-MM-DD", "label": "날짜가 명시된 일정만, 예: 서류 발표"}],' +
      ' "duties": ["주요업무, 짧게, 최대 6개"], "requirements": ["자격요건, 짧게, 최대 6개"], "preferred": ["우대사항, 짧게, 최대 6개"],' +
      ' "summary": "이 공고를 한두 문장으로 요약"}\n' +
      "본문에 없는 정보는 지어내지 말고 null, 빈 문자열, 빈 배열로 둬. 모든 텍스트는 한국어로.\n\n" +
      "공고 링크: " + url + "\n\n공고 본문:\n" + text.slice(0, 60000);
  }
  function normalize(d, url) {
    d = d && typeof d === "object" ? d : {};
    var sched = Array.isArray(d.schedule) ? d.schedule.filter(function (s) { return s && validDate(s.date) && s.label; })
      .map(function (s) { return { date: s.date, label: String(s.label) }; }) : [];
    return {
      company: String(d.company || ""), title: String(d.title || ""), employment: String(d.employment || ""), location: String(d.location || ""),
      applyStart: validDate(d.applyStart) ? d.applyStart : "", applyEnd: validDate(d.applyEnd) ? d.applyEnd : "",
      applyEndTime: /^\d{1,2}:\d{2}$/.test(d.applyEndTime || "") ? d.applyEndTime : "", applyNote: String(d.applyNote || ""),
      process: arr(d.process), schedule: sched, duties: arr(d.duties), requirements: arr(d.requirements), preferred: arr(d.preferred),
      summary: String(d.summary || ""), url: url
    };
  }
  function newJob(fields) {
    return Object.assign({ id: uid(), url: "", company: "", title: "", employment: "", location: "", applyStart: "", applyEnd: "", applyEndTime: "",
      applyNote: "", process: [], schedule: [], duties: [], requirements: [], preferred: [], summary: "", status: "관심", memos: [], addedAt: todayStr() }, fields);
  }

  function addFromForm(ev) {
    ev.preventDefault();
    var url = document.getElementById("f-url").value.trim();
    var text = document.getElementById("f-text").value.trim();
    var out = document.getElementById("f-out");
    if (!safeUrl(url)) { out.textContent = "https:// 로 시작하는 공고 링크를 넣어 주세요."; return; }
    if (!text) {
      var host = ""; try { host = new URL(url).hostname.replace(/^www\./, ""); } catch (x) {}
      var pj = newJob({ url: url, title: "공고 읽는 중", company: host, pending: true });
      jobs.push(pj);
      try { sessionStorage.removeItem("jb-draft"); } catch (x) {}
      requestAnalysis().then(function () { save("링크를 등록했어요. Claude가 본문을 읽고 채워 넣을 거예요."); });
      return;
    }
    if (!sampleApi) { out.textContent = "이 화면에서는 본문 정리를 쓸 수 없어요. 본문을 비우고 링크만 추가해 주세요."; return; }
    var btn = document.getElementById("f-submit");
    btn.disabled = true; out.textContent = ""; out.appendChild(h("span", { class: "spin" })); out.appendChild(document.createTextNode(" 공고를 읽고 정리하는 중이에요. 보통 10~40초 걸려요."));
