<title>중화동 깔롱커플의 철원 크리스마스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 겨울밤 포스터. 도로 스트립(이동) + 벤토 카드(머무는 곳). 한 가지 밤 톤으로 고정.
   색: 철원의 밤 · 눈 · 얼음 · 두루미 정수리 · 숯불 */
:root{
  --night:#0c1424;
  --night-2:#141f36;
  --night-3:#1c2a47;
  --snow:#f2f5fa;
  --muted:#8e9fbb;
  --line:rgba(242,245,250,.12);
  --ice:#9fd6ff;
  --crane:#ff5a5f;
  --ember:#ffc247;
  --pine:#4fd1a1;
  --f-hero:"Bagel Fat One","Jua","Apple SD Gothic Neo",sans-serif;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--snow);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--ice);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:6px}
.label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.05;letter-spacing:-.01em}
section{display:flex;flex-direction:column;gap:18px}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}

/* hero */
.hero{position:relative;padding-block:56px 8px;display:flex;flex-direction:column;gap:18px;isolation:isolate}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hero h1{font-family:var(--f-hero);font-weight:400;line-height:.86;letter-spacing:-.02em;font-size:clamp(4.6rem,22vw,10rem)}
.hero h1 span{display:block}
.hero h1 .pre{font-family:var(--f-display);font-size:.3em;line-height:1.2;letter-spacing:0;color:var(--ice);margin-bottom:.2em}
.members{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.members .m{font-family:var(--f-display);font-size:1.05rem;padding:5px 14px;border-radius:99px;background:var(--night-3)}
.hero h1 .x{color:var(--crane);font-size:.5em;letter-spacing:0}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{font-family:var(--f-mono);font-size:.8rem;padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.dday{background:var(--crane);border-color:var(--crane);color:#fff;font-weight:700}
.pill.sync{display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
.pill.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.sync.live{color:var(--pine)}
.pill.sync.live::before{background:var(--pine);box-shadow:0 0 0 4px rgba(79,209,161,.18)}

/* plan switch */
.switch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch button{font:inherit;color:var(--snow);text-align:left;cursor:pointer;border:2px solid var(--line);background:var(--night-2);
  border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0;transition:border-color .2s,background .2s}
.switch .t{font-family:var(--f-display);font-size:clamp(1.6rem,6vw,2.2rem);line-height:1}
.switch .s{font-size:.85rem;color:var(--muted)}
.switch button[aria-pressed="true"]{border-color:var(--ice);background:var(--night-3)}
.switch button[aria-pressed="true"] .t{color:var(--ice)}
.switch button:disabled{cursor:default}

/* road strip */
.road{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 16px;border:1.5px dashed var(--line);border-radius:20px}
.road .stop{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.road .stop b{font-family:var(--f-mono);font-weight:700;color:var(--ice);font-variant-numeric:tabular-nums}
.road .arr{color:var(--muted);font-family:var(--f-mono)}

/* bento */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.slot{background:var(--night-2);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative;overflow:hidden}
.slot .t{font-family:var(--f-mono);font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.slot h3{font-family:var(--f-display);font-weight:400;font-size:1.55rem;line-height:1.1}
.slot p{color:var(--muted);font-size:.9rem}
.slot.wide{grid-column:span 2}
@media (max-width:540px){.slot.wide{grid-column:auto}}
.slot.ice{background:linear-gradient(160deg,#1b3352,#142139)}
.slot.ice .t{color:var(--ice)}
.slot.spa{background:linear-gradient(160deg,#173a3a,#132433)}
.slot.spa .t{color:var(--pine)}
.slot.fire{background:linear-gradient(160deg,#4a2a14,#2a1a18)}
.slot.fire .t{color:var(--ember)}
.slot.night{background:linear-gradient(160deg,#3d1622,#1d1730)}
.slot.night .t{color:var(--crane)}
.slot.tour .t{color:var(--snow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;padding:3px 10px;border-radius:99px;background:rgba(242,245,250,.08);color:var(--snow)}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem}

/* shared checks */
.chk{display:flex;flex-direction:column;gap:2px;margin-top:4px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.22)}
.chk .ck-title{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;color:var(--ember);text-transform:uppercase;padding-bottom:2px}
.ck{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;padding:6px 0;cursor:pointer;font-size:.9rem;line-height:1.4}
.ck input{appearance:none;width:20px;height:20px;margin:0;border-radius:6px;border:1.5px solid var(--muted);background:transparent;display:grid;place-items:center;cursor:pointer}
.ck input:checked{background:var(--pine);border-color:var(--pine)}
.ck input:checked::after{content:"";width:9px;height:5px;border:2px solid var(--night);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.ck input:disabled{cursor:default;opacity:.6}
.ck input:checked + span .lbl{text-decoration:line-through;text-decoration-color:rgba(242,245,250,.45);color:var(--muted)}
.ck small{display:block;color:var(--muted);font-size:.78rem}
.who{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;color:var(--pine);margin-top:2px}
.who img{width:14px;height:14px;border-radius:50%}
.who:empty{display:none}

/* lists */
.lists{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.lists{grid-template-columns:1fr}}
.panel{background:var(--night-2);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.panel .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h3{font-family:var(--f-display);font-weight:400;font-size:1.4rem}
.prog{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.panel .chk{background:transparent;padding:0;margin:0}

/* gift */
.gift{background:var(--night-2);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.gift .row{display:flex;gap:8px;flex-wrap:wrap}
.gift input[type=text]{flex:1 1 220px;min-width:0;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--night);color:var(--snow)}
.btn{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:14px;padding:10px 18px;background:var(--crane);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--snow)}
.race-wrap{border-radius:16px;overflow:hidden;background:var(--night)}
#race{display:block}
.order{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;counter-reset:o}
.order li{counter-increment:o;background:var(--night);border-radius:99px;padding:5px 14px 5px 6px;display:flex;gap:8px;align-items:center}
.order li::before{content:attr(data-n);font-family:var(--f-mono);font-size:.75rem;font-weight:700;background:var(--ember);color:var(--night);width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
footer{font-size:.8rem;color:var(--muted)}
</style>

<div class="wrap">

<header class="hero">
  <canvas id="snow" aria-hidden="true"></canvas>
  <span class="label">Cheorwon · Christmas 2026</span>

  <div id="ck-trek"></div>
</section>

<section aria-labelledby="h-day">

</section>

<section aria-labelledby="h-day2">

  </div>

</section>

<section aria-labelledby="h-list">
  <div class="sec-head">
    <h2 id="h-list">챙길 것</h2>
    <span class="label">같이 체크</span>
  </div>
  <div class="lists">
    <div class="panel"><div class="head"><h3>준비물</h3><span class="prog" id="prog-pack"></span></div><div id="ck-pack"></div></div>
    <div class="panel"><div class="head"><h3>롯데슈퍼</h3><span class="prog" id="prog-shop"></span></div><div id="ck-shoplist"></div></div>
  </div>
</section>

<section aria-labelledby="h-gift">
  <div class="sec-head">
    <h2 id="h-gift">2만 원 선물교환</h2>
    <span class="label">눈썰매 레이스</span>
  </div>
  <div class="gift">
    <label for="names" style="color:var(--muted);font-size:.88rem">참가자 이름 (쉼표로 구분)</label>
    <div class="row">
      <input type="text" id="names" value="나윤, 종호, 채연, 영선" autocomplete="off">
      <button type="button" class="btn" id="draw">레이스 시작</button>
    </div>
    <p id="order-hint" style="color:var(--muted);font-size:.88rem">이름을 적고 레이스 시작을 눌러 주세요.</p>
    <div class="race-wrap" id="race-wrap" hidden><canvas id="race" role="img" aria-label="선물교환 눈썰매 레이스"></canvas></div>
    <div class="row" id="race-ctl" hidden>
      <span id="race-status" style="color:var(--muted);font-size:.88rem;align-self:center;flex:1 1 200px"></span>
      <button type="button" class="btn ghost" id="replay">다시 보기</button>
    </div>
    <ol class="order" id="order" aria-live="polite"></ol>
  </div>
</section>

<footer>물윗길 · 모노레일 정보는 공개 기사 기준이에요.</footer>
</div>

  function ckHTML(g,withTitle){
    var G=GROUPS[g]; if(!G)return '';
    return '<div class="chk">'+(withTitle!==false&&G.title?'<span class="ck-title">'+esc(G.title)+'</span>':'')+G.ids.map(function(id){
      var el='ck-'+(uid++), it=ITEMS[id];
      return '<label class="ck" for="'+el+'"><input type="checkbox" id="'+el+'" data-id="'+id+'"><span><span class="lbl">'+esc(it[0])+'</span>'+(it[1]?'<small>'+esc(it[1])+'</small>':'')+'<span class="who" data-who="'+id+'"></span></span></label>';
    }).join('')+linksHTML(G.links)+'</div>';
  }
  function slotHTML(s){
    return '<article class="slot '+(s.cls||'')+'"><span class="t">'+s.t+'</span><h3>'+esc(s.h)+'</h3>'+(s.p?'<p>'+esc(s.p)+'</p>':'')+
      (s.chips?'<div class="chips">'+s.chips.map(function(c){return '<span class="chip">'+esc(c)+'</span>'}).join('')+'</div>':'')+
      linksHTML(s.links)+ckHTML(s.ck)+'</article>';
  }
  function renderPlan(){
    var P=plans[plan];
    document.querySelectorAll('.switch button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.plan===plan?'true':'false')});
    $('planLabel').textContent=P.label;
    $('road').innerHTML=P.road.map(function(r,i){return (i?'<span class="arr">→</span>':'')+'<span class="stop"><b>'+r[0]+'</b>'+esc(r[1])+'</span>'}).join('');
    $('slots').innerHTML=P.slots.map(slotHTML).join('');
    paint();
  }
  $('ck-trek').innerHTML=ckHTML('trek');
  $('slots2').innerHTML=day2.map(slotHTML).join('');
  $('ck-pack').innerHTML=ckHTML('pack',false);
  $('ck-shoplist').innerHTML=ckHTML('shoplist',false);

  function paint(){
    document.querySelectorAll('input[data-id]').forEach(function(c){
      var s=state[c.dataset.id]; c.checked=!!(s&&s.done); c.disabled=!canWrite;
    });
    document.querySelectorAll('[data-who]').forEach(function(w){
      var s=state[w.dataset.who]; w.textContent='';
      if(s&&s.done&&s.by&&names[s.by]){
        var p=names[s.by];
        if(p.avatarUrl){var img=document.createElement('img');img.src=p.avatarUrl;img.alt='';w.appendChild(img)}
        w.appendChild(document.createTextNode((p.name||'누군가')+' 체크'));
      }
    });
    ['pack','shoplist'].forEach(function(g){
      var ids=GROUPS[g].ids, n=ids.filter(function(id){return state[id]&&state[id].done}).length;
      $(g==='pack'?'prog-pack':'prog-shop').textContent=n+' / '+ids.length;
    });
  }
  function resolveNames(){
    if(!user||!user.profiles)return;
    var ids=[];Object.keys(state).forEach(function(k){var b=state[k].by;if(b&&ids.indexOf(b)<0)ids.push(b)});
    if(!ids.length)return;
    Promise.resolve(user.profiles(ids)).then(function(ps){names=ps||{};paint()}).catch(function(){});
  }

  /* 쓰기: 문서당 한 번에 하나 */
  var pending={}, queued={};
  function writeCheck(id,done){
    if(!db){state[id]={done:done};store.set('cw-local',JSON.stringify(state));paint();return}
    state[id]={done:done,by:myId};paint();
    if(pending[id]){queued[id]=done;return}
    pending[id]=true;
    db.collection('checks').doc(id).set({done:done,by:myId||null,at:Date.now()})
      .catch(function(e){if(e&&e.code==='invalid_argument'){canWrite=false;setSync('보기 전용',false);paint()}})
      .then(function(){pending[id]=false;if(id in queued){var v=queued[id];delete queued[id];if(v!==done)writeCheck(id,v)}});
  }
  var planPending=false;
  function writePlan(p){
    plan=p;renderPlan();
    if(!db){store.set('cw-plan',p);return}
    if(planPending)return;
    planPending=true;
    db.doc('settings/plan').set({plan:p,by:myId||null,at:Date.now()}).catch(function(){}).then(function(){
      planPending=false; if(plan!==p)writePlan(plan);
    });
  }

  document.addEventListener('change',function(e){
    var id=e.target.dataset&&e.target.dataset.id; if(!id||!canWrite)return;
    writeCheck(id,e.target.checked);
  });
  document.querySelectorAll('.switch button').forEach(function(b){b.addEventListener('click',function(){if(canWrite)writePlan(b.dataset.plan)})});

  function setSync(t,live){var s=$('sync');s.textContent=t;s.classList.toggle('live',!!live)}
  function useLocal(){
    db=null;
    try{state=JSON.parse(store.get('cw-local')||'{}')||{}}catch(e){state={}}
    plan=store.get('cw-plan')==='b'?'b':'a';
    try{applyGift(JSON.parse(store.get('cw-gift')||'null'))}catch(e){}
    setSync('이 기기에만 저장',false);renderPlan();
  }

  /* 선물교환 눈썰매 레이스 (이름 · 레이스 시드는 공유 → 모두 같은 레이스) */
  var namesEl=$('names'), order=$('order'), gift={names:namesEl.value,race:null}, giftPending=false, giftQueued=false;
  var COLORS=['#ff5a5f','#3d8bff','#22b07d','#ff9f1c','#9b5de5','#f15bb5','#00a6a6','#e0b100'];
  var DT=1/60, COUNT=1.8, sim=null, raceSeed=null, playing=null;
  var cv2=$('race'), c2=cv2.getContext&&cv2.getContext('2d');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function parseNames(s){return s.split(/[,，\n]/).map(function(x){return x.trim()}).filter(Boolean).slice(0,8)}
  function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function simulate(players,seed){
    var R=rng(seed), n=players.length, pos=[], fin=[], ord=[], frames=[], S=[];
    for(var i=0;i<n;i++){
      pos.push(0);fin.push(-1);
      var ev=[], k=2+Math.floor(R()*3);
      for(var j=0;j<k;j++)ev.push({t:1+R()*9,type:R()<.5?'boost':'slip',d:.6+R()*.7});
      S.push({base:.078+R()*.01,ev:ev,a:R()*6,b:.6+R()*1.2,c:R()*6});
    }
    var t=0;
    while(ord.length<n&&t<40){
      var fx=[];
      for(var i2=0;i2<n;i2++){
        if(fin[i2]>=0){fx.push(0);continue}
        var s=S[i2], m=1+.14*Math.sin(t*s.b+s.a)+.06*Math.sin(t*2.7+s.c), f=0;
        s.ev.forEach(function(e){if(t>=e.t&&t<e.t+e.d){f=e.type==='boost'?1:2}});
        if(f===1)m*=1.9; else if(f===2)m*=.22;
        pos[i2]+=s.base*m*DT;
        if(pos[i2]>=1){pos[i2]=1;fin[i2]=t;ord.push(i2);f=0}
        fx.push(f);
      }
      frames.push({p:pos.slice(),fx:fx});
      t+=DT;
    }
    return {players:players,frames:frames,order:ord,fin:fin};
  }

  function rr(x,y,w,h,r){c2.beginPath();c2.moveTo(x+r,y);c2.arcTo(x+w,y,x+w,y+h,r);c2.arcTo(x+w,y+h,x,y+h,r);c2.arcTo(x,y+h,x,y,r);c2.arcTo(x,y,x+w,y,r);c2.closePath()}
  function drawRace(fi,count){
    if(!c2||!sim)return;
    var n=sim.players.length, W=Math.max(320,cv2.parentNode.clientWidth), LH=54, TOP=70, H=TOP+n*LH+14;
    var dpr=Math.min(window.devicePixelRatio||1,2);
    if(cv2.width!==Math.round(W*dpr)||cv2.height!==Math.round(H*dpr)){cv2.width=Math.round(W*dpr);cv2.height=Math.round(H*dpr);cv2.style.width=W+'px';cv2.style.height=H+'px'}
    c2.setTransform(dpr,0,0,dpr,0,0);
    var fr=sim.frames[Math.max(0,Math.min(fi,sim.frames.length-1))], ft=Math.max(0,fi)*DT;
    /* 밤하늘 + 산 + 소나무 */
    var g=c2.createLinearGradient(0,0,0,TOP);g.addColorStop(0,'#0c1424');g.addColorStop(1,'#1c2a47');
    c2.fillStyle=g;c2.fillRect(0,0,W,H);
    c2.fillStyle='#f2f5fa';c2.beginPath();c2.arc(W-46,24,11,0,Math.PI*2);c2.fill();
    c2.fillStyle='#24365a';c2.beginPath();c2.moveTo(0,TOP);
    for(var x=0;x<=W;x+=40)c2.lineTo(x,TOP-14-18*Math.abs(Math.sin(x*.013+1)));
    c2.lineTo(W,TOP);c2.fill();
    var shift=(ft*30)%46;
    for(var tx=-46;tx<W+46;tx+=46){
      var px=tx-shift, h2=18+((Math.round(tx/46)*7)%3)*5;
      c2.fillStyle='#174e3b';c2.beginPath();c2.moveTo(px,TOP-h2);c2.lineTo(px-9,TOP);c2.lineTo(px+9,TOP);c2.fill();
      c2.fillStyle='#f2f5fa';c2.beginPath();c2.moveTo(px,TOP-h2);c2.lineTo(px-3.5,TOP-h2+7);c2.lineTo(px+3.5,TOP-h2+7);c2.fill();
    }
    /* 눈 레인 */
    var X0=78, X1=W-44;
    for(var i=0;i<n;i++){
      var y=TOP+i*LH;
      c2.fillStyle=i%2?'#dbe6f3':'#eaf1fa';c2.fillRect(0,y,W,LH);
      c2.fillStyle='#0c1424';c2.font='17px Jua, sans-serif';c2.textAlign='left';c2.textBaseline='middle';
      var nm=sim.players[i];c2.fillText(nm.length>4?nm.slice(0,4):nm,10,y+LH/2);
    }
    c2.strokeStyle='rgba(12,20,36,.25)';c2.setLineDash([4,6]);c2.lineWidth=1.5;
    c2.beginPath();c2.moveTo(X0,TOP);c2.lineTo(X0,TOP+n*LH);c2.stroke();c2.setLineDash([]);
    for(var cy=TOP,row=0;cy<TOP+n*LH;cy+=9,row++)for(var cx=0;cx<2;cx++){c2.fillStyle=(row+cx)%2?'#0c1424':'#ffffff';c2.fillRect(X1+cx*7,cy,7,Math.min(9,TOP+n*LH-cy))}
    /* 썰매 */
    for(var k=0;k<n;k++){
      var p=fr.p[k], fx=fr.fx[k], col=COLORS[k%COLORS.length];
      var sx=X0+p*(X1-X0-6), sy=TOP+k*LH+LH/2+4;
      c2.save();c2.translate(sx,sy);
      if(fx===2)c2.rotate(Math.sin(ft*28+k)*.45);
      if(p>0&&p<1){
        c2.fillStyle='rgba(255,255,255,.95)';
        for(var d=0;d<5;d++){var dx=-28-((ft*90+d*13+k*7)%34),dy=6-((d*5+k*3+Math.floor(ft*20))%9);c2.beginPath();c2.arc(dx,dy,1.6+(d%2),0,Math.PI*2);c2.fill()}
      }
      if(fx===1){c2.strokeStyle=col;c2.lineWidth=2.5;c2.lineCap='round';for(var l=0;l<3;l++){c2.beginPath();c2.moveTo(-34-l*4,-10+l*8);c2.lineTo(-58-l*6,-10+l*8);c2.stroke()}}
      c2.strokeStyle='#3a4a66';c2.lineWidth=2.5;c2.lineCap='round';
      c2.beginPath();c2.moveTo(-24,9);c2.lineTo(14,9);c2.quadraticCurveTo(22,9,20,1);c2.stroke();
      c2.fillStyle=col;rr(-24,-4,38,11,5);c2.fill();
      c2.beginPath();c2.arc(-6,-14,10,0,Math.PI*2);c2.fillStyle='#ffffff';c2.fill();c2.lineWidth=3;c2.strokeStyle=col;c2.stroke();
      c2.fillStyle=col;c2.font='12px Jua, sans-serif';c2.textAlign='center';c2.textBaseline='middle';c2.fillText(sim.players[k].charAt(0),-6,-13.5);
      c2.restore();
      if(fx){
        c2.font='15px Jua, sans-serif';c2.textAlign='center';c2.lineWidth=4;c2.strokeStyle='#0c1424';
        var tt=fx===1?'부스트!':'꽈당!';c2.strokeText(tt,sx,sy-34);c2.fillStyle=fx===1?'#ffc247':'#ff5a5f';c2.fillText(tt,sx,sy-34);
      }
      if(sim.fin[k]>=0&&ft>=sim.fin[k]){
        var rk=sim.order.indexOf(k)+1, bx=X1+30, by=TOP+k*LH+LH/2;
        c2.beginPath();c2.arc(bx,by,13,0,Math.PI*2);c2.fillStyle=rk===1?'#ffc247':'#0c1424';c2.fill();
        c2.fillStyle=rk===1?'#0c1424':'#f2f5fa';c2.font='bold 13px JetBrains Mono, monospace';c2.textAlign='center';c2.textBaseline='middle';c2.fillText(rk,bx,by+.5);
      }
    }
    if(count){
      c2.font='64px "Bagel Fat One", Jua, sans-serif';c2.textAlign='center';c2.textBaseline='middle';
      c2.lineWidth=8;c2.strokeStyle='#0c1424';c2.strokeText(count,W/2,TOP+n*LH/2);c2.fillStyle='#ff5a5f';c2.fillText(count,W/2,TOP+n*LH/2);
    }
  }
  function showResult(done){
    order.innerHTML=done&&sim?sim.order.map(function(i,r){return '<li data-n="'+(r+1)+'">'+esc(sim.players[i])+'</li>'}).join(''):'';
    $('race-status').textContent=done?'들어온 순서대로 선물을 골라요.':'레이스 중…';
  }
  function play(){
    if(!sim)return;
    if(playing)cancelAnimationFrame(playing);
    $('race-wrap').hidden=false;$('race-ctl').hidden=false;$('order-hint').hidden=true;
    if(reduce){drawRace(sim.frames.length-1);showResult(true);return}
    showResult(false);
    var start=performance.now();
    function step(now){
      var e=(now-start)/1000;
      if(e<COUNT){drawRace(0,String(3-Math.floor(e/(COUNT/3))));playing=requestAnimationFrame(step);return}
      var fi=Math.floor((e-COUNT)/DT);
      drawRace(fi,e-COUNT<.5?'GO!':'');
      if(fi<sim.frames.length+30)playing=requestAnimationFrame(step);else{playing=null;showResult(true)}
    }
    playing=requestAnimationFrame(step);
  }
  function showFinal(){
    if(!sim)return;
    $('race-wrap').hidden=false;$('race-ctl').hidden=false;$('order-hint').hidden=true;
    drawRace(sim.frames.length-1);showResult(true);
  }
  window.addEventListener('resize',function(){if(sim&&!playing)drawRace(sim.frames.length-1)});

  function saveGift(){
    if(!db){store.set('cw-gift',JSON.stringify({names:gift.names,race:gift.race,at:Date.now()}));return}
    if(giftPending){giftQueued=true;return}
    giftPending=true;
    db.doc('settings/gift').set({names:gift.names,race:gift.race,by:myId||null,at:Date.now()}).catch(function(){}).then(function(){
      giftPending=false; if(giftQueued){giftQueued=false;saveGift()}
    });
  }
  function draw(){
    if(!canWrite)return;
    var players=parseNames(namesEl.value);
    if(players.length<2){$('order-hint').hidden=false;$('order-hint').textContent='두 명 이상 적어 주세요.';return}
    var seed=Math.floor(Math.random()*2147483647);
    gift={names:namesEl.value,race:{players:players,seed:seed}};
    raceSeed=seed; sim=simulate(players,seed); play(); saveGift();
  }
  function applyGift(v){
    if(!v)return;
    if(typeof v.names==='string'&&document.activeElement!==namesEl)namesEl.value=v.names;
    var r=v.race, race=null;
    if(r&&Array.isArray(r.players)&&typeof r.seed==='number'){
      var ps=r.players.filter(function(s){return typeof s==='string'}).slice(0,8);
      if(ps.length>=2)race={players:ps,seed:r.seed};
    }
    gift={names:typeof v.names==='string'?v.names:namesEl.value,race:race};
    if(race&&race.seed!==raceSeed){
      raceSeed=race.seed; sim=simulate(race.players,race.seed);
      if(typeof v.at==='number'&&Date.now()-v.at<30000)play(); else showFinal();
    }
  }
  $('draw').addEventListener('click',draw);
  $('replay').addEventListener('click',play);
  namesEl.addEventListener('change',function(){if(!canWrite||namesEl.value===gift.names)return;gift.names=namesEl.value;saveGift()});

  renderPlan();
  var started=false;
  var fallback=setTimeout(function(){if(!started)useLocal()},10000);
  if(window.claude&&window.claude.use){
    Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
      if(!r[0]){clearTimeout(fallback);useLocal();return}
      started=true; db=r[0]; user=r[1];
      var tm=setTimeout(function(){setSync('연결 지연',false)},10000);
      Promise.resolve(user&&user.id?user.id():null).then(function(id){myId=id}).catch(function(){});
      Promise.resolve(user&&user.can?user.can('data.write'):null).then(function(c){if(c===false){canWrite=false;setSync('보기 전용',true);paint()}}).catch(function(){});
      db.collection('checks').onSnapshot(function(snap){
        var next={};snap.docs.forEach(function(d){var v=d.data();if(v)next[d.id]={done:!!v.done,by:v.by||null}});
        state=next;paint();resolveNames();
        if(!snap.metadata.fromCache){clearTimeout(tm);clearTimeout(fallback);if(canWrite)setSync('실시간 공유 중',true)}
      },function(){clearTimeout(tm);setSync('공유 연결 끊김',false)});
      db.doc('settings/gift').onSnapshot(function(d){if(d.exists)applyGift(d.data())},function(){});
      db.doc('settings/plan').onSnapshot(function(d){
        var v=d.exists&&d.data(); if(v&&(v.plan==='a'||v.plan==='b')&&v.plan!==plan&&!planPending){plan=v.plan;renderPlan()}
      },function(){});
    }).catch(function(){clearTimeout(fallback);useLocal()});
  }else{clearTimeout(fallback);useLocal()}


  /* 눈 */
  var cv=$('snow'),cx=cv.getContext&&cv.getContext('2d');
  if(cx){
    var flakes=[],W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2);
    function size(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
    size();window.addEventListener('resize',size);
    for(var i=0;i<70;i++)flakes.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.6,s:Math.random()*.25+.1,d:Math.random()*Math.PI*2});
    var still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function frame(){
      cx.clearRect(0,0,W,H);cx.fillStyle='rgba(242,245,250,.75)';
      flakes.forEach(function(f){
        if(!still){f.y+=f.s/H*2.2;f.d+=.01;f.x+=Math.sin(f.d)*.0004;if(f.y>1){f.y=0;f.x=Math.random()}}
        cx.beginPath();cx.arc(f.x*W,f.y*H,f.r,0,Math.PI*2);cx.fill();
      });
      if(!still)requestAnimationFrame(frame);
    }
    frame();
  }
})();
</script>
